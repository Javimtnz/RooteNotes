<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>RootNotes - Próximamente</title>
    <meta name="description" content="rootnotes está en construcción. ¡Vuelve pronto!">

    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#140b1e">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&family=Cantarell:wght@400;700&family=Fira+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">

<style>
        
/* Paleta de colores y lista de fuentes */
     :root {
        --fondo: #140b1e;
        --texto: #f5eefc;
        --texto-suave: rgba(245,238,252,0.68);
        --texto-tenue: rgba(245,238,252,0.4);
        --linea: rgba(245,238,252,0.14);
        --acento: #a874e8;
        --acento-2: #7030a0;
        --texto-sobre-acento: #1b0f2e;
        --degradado-1: #a874e8;
        --degradado-2: #7030a0;
        --degradado-3: #c25fd1;
        --degradado-4: #4c2e7a;
        --fuente-base: "Fira Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        --fuente-titulos: "Cantarell", var(--fuente-base);
        --fuente-mono: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
        --fuente-marca: "Audiowide";
     }

/* Estilo general de la página */
     body{
        min-height: 100svh;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--fondo);
        color: var(--texto);
        font-family: var(--fuente-base);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
        position: relative;
        padding:1.5rem;
     }

/* CSS reseteo */  
    *, *::before, *::after {box-sizing: border-box; margin: 0;}
    html {-webkit-text-size-adjust: 100%;}

/* Estilo y efecto del fondo */
    .fondo-degradado {
        position: fixed;
        inset: 0;
        z-index: -1;
        background: 
         radial-gradient(circle 620px at 20% 25%, color-mix(in srgb, var(--degradado-1) 55%, transparent) 0%, transparent 60%),
         radial-gradient(circle 700px at 78% 68%, color-mix(in srgb, var(--degradado-3) 45%, transparent) 0%, transparent 60%),
         radial-gradient(circle 560px at 85% 15%, color-mix(in srgb, var(--degradado-4) 35%, transparent) 0%, transparent 55%),
         var(--fondo);
        filter: blur(70px) saturate(140%);
        animation: drift 12s ease-in-out infinite alternate;
    }

    @keyframes drift{
        0% {transform: translate3d(0, 0, 0) scale(1); }
        100% {transform: translate3d(-10%, 8%, 0) scale(1.2);}
    }

    @media (prefers-reduced-motion: reduce){
        .fondo-degradado {animation: none; }
    }

/* rejilla del fondo */
    .fondo-cuadricula {
        position: fixed;
        inset: 0;
        z-index: -1;
        background-image: 
            linear-gradient(var(--linea) 1px, transparent 1px),
            linear-gradient(90deg, var(--linea) 1px, transparent 1px);
        background-size: 56px 56px;
        -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, black 40%, transparent 90%);
                mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, black 40%, transparent 90%);    
    }

    .tarjeta {
        width: 100%;
        max-width: 34rem;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
/*Root Notes */
    .marca {
      font-family: var(--fuente-marca);
      font-weight: 700;
      font-size: 1.4rem;
      letter-spacing: -0.02em;
      margin-bottom: 2.2rem;
    }

    .marca span { color: var(--acento);}

/* Estado "En contrucción": animación y esilo*/
    .estado {

        display: inline-flex;
        align-items: center;
        gap: .55rem;
        padding: .5rem .9rem;
        border-radius: 999px;
        border: 1px solid var(--linea);
        font-family: var(--fuente-mono);
        font-size: .78rem;
    }
    .estado-dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: var(--acento);
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--acento) 22%, transparent);
        animation: pulso 2.4s ease-in-out infinite;
    }
    @keyframes pulso {
        0%, 100% {opacity: 1;}
        50% {opacity: .45;}
    }
    @media (prefers-reduced-motion: reduce){
        .estado-dot {animation:none;}
    }

/* Título nivel 1*/
    h1 {
        font-family: var(--fuente-base);
        font-weight: 600;
        line-height: 1.1;
        letter-spacing: -0.02em;
        font-size: clamp(2rem, 6vw, 3rem);
        max-width: 18ch;
        margin-bottom: 1.1rem;
    }

    h1 em {
        font-style: normal;
        background: linear-gradient(120deg, var(--degradado-1), var(--degradado-3));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }

    p.cexplicativo {
        color: var(--texto-suave);
        font-size: 1.02rem;
        max-width: 40ch;
        margin-bottom: 2.4rem;
    }
/* Estilo del botón "Escribirme"*/
    .botonE {
        display: inline-flex;
        align-items: center;
        gap: .55rem;
        padding: .85rem 1.6rem;
        border-radius: 999px;
        font-family: var(--fuente-titulos);
        font-weight: 600;
        font-size: .95rem;
        color: var(--texto-sobre-acento);
        background: linear-gradient(135deg, var(--degradado-1), var(--degradado-2));
        box-shadow: 0 10px 30px -8px color-mix(in srgb, var(--acento-2) 55%, transparent);
        transition: transform .3s cubic-bezier(0.16,1,0.3,1), box-shadow .3s cubic-bezier(0.16,1,0.3,1); 
    }
    .botonE:hover {
        transform: translateY(-2px);
        box-shadow: 0 16px 36px -8px color-mix(in srgb, var(--acento-2) 65%, transparent);;
    }
    .botonE svg {width: 16px; height: 16px; flex-shrink: 0;}
    
/* Estilo del pie de página */
     footer {
       position: fixed;
       bottom: 1.4rem;
       left: 0; right: 0;
       text-align: center;
       font-family: var(--fuente-mono);
       font-size: .72rem;
       color: var(--texto-tenue);
     }
    </style>
</head>

<body>

    <div class ="fondo-degradado" aria-hidden="true"></div>
    <div class="fondo-cuadricula" aria-hidden="true"></div>
    <main class="tarjeta">
        <p class="marca">Root<span>Notes</span></p>

        <span class="estado">
            <span class="estado-dot"></span>
            En Contrucción
        </span>

        <h1>
            Estoy preparando <em>algo nuevo</em>.
        </h1>

        <p class ="cexplicativo">
            Mi blog está de camino. Mientras tanto, pueden contactar conmigo por el siguiente botón
        </p>

        <a class="botonE" href="mailto:javi.martinez.lpz@outlook.com">
            Escribirme
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 6-10 7L2 6"></path></svg>
        </a>
</main>
<footer>JML · España</footer>

</body>
</html>
